name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      # Pushes and PRs made with GITHUB_TOKEN trigger no workflows, so bot PRs
      # never got their required checks. A token from the release bot GitHub App
      # acts as the App, and its pushes trigger CI like anyone else's.
      - name: Mint a release bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install root dependencies
        run: npm install

      - name: Install webview dependencies
        working-directory: webview
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Package
        run: npx vsce package

      - name: Publish to Marketplace
        run: npx vsce publish --pat ${{ secrets.VSCE_PAT }}

      - name: Upload VSIX to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ needs.release-please.outputs.tag_name }} *.vsix
