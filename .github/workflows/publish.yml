name: Publish

# Manual re-publish of a tag that already has a release. The automatic publish is
# the publish job in release-please.yml. This workflow has no `release` trigger:
# release-please now creates releases with the release bot App's token, so a
# `release: published` trigger here would publish every version twice.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. lucent-code-v0.2.0)'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || 'main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install root dependencies
        run: npm install

      - name: Install webview dependencies
        working-directory: webview
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Package
        run: npx vsce package

      - name: Publish to Marketplace
        run: npx vsce publish --pat ${{ secrets.VSCE_PAT }}
